<script>
// ── 状态 ──────────────────────────────────────────────────────────────────
let products = window.__XHS_DATA__ || [];
let groups = [];
let activeGroup = '全部';
let parsedProduct = null;
let deleteTargetId = null;
let detailChart = null;

// ── 初始化 ────────────────────────────────────────────────────────────────
function init() {
    // 收集所有分组
    const groupSet = new Set(['默认分组']);
    products.forEach(p => { if (p.group) groupSet.add(p.group); });
    groups = Array.from(groupSet);

    // 渲染日期
    const now = new Date();
    document.getElementById('today-label').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

    // 最后更新时间
    let lastTime = '';
    products.forEach(p => {
        if (p.history && p.history.length) {
            const t = p.history[p.history.length - 1].time;
            if (t > lastTime) lastTime = t;
        }
    });
    document.getElementById('last-update').textContent =
        lastTime ? `上次更新：${lastTime}` : '';

    document.getElementById('product-count').textContent =
        `共 ${products.length} 个商品`;

    renderGroups();
    renderCards();
    if (window.lucide) lucide.createIcons();
}

// ── 分组渲染 ──────────────────────────────────────────────────────────────
function renderGroups() {
    const container = document.getElementById('group-list');
    const allGroups = ['全部', ...groups];
    container.innerHTML = allGroups.map(g => {
        const count = g === '全部'
            ? products.length
            : products.filter(p => p.group === g).length;
        const isActive = g === activeGroup;
        const editSvg = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
        return `
        <div class="group-item relative w-full"
             onmouseenter="this.querySelector('.group-rename-btn')&&(this.querySelector('.group-rename-btn').style.opacity='1')"
             onmouseleave="this.querySelector('.group-rename-btn')&&(this.querySelector('.group-rename-btn').style.opacity='0')">
            <div onclick="setActiveGroup('${g.replace(/'/g,"\\'")}');return false;" role="button" tabindex="0"
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-semibold transition-all cursor-pointer
                       ${isActive ? 'bg-blue-600 text-white shadow-md shadow-blue-600/40' : 'hover:bg-slate-800/60 text-slate-400 hover:text-slate-200'}">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-1.5 h-1.5 rounded-full shrink-0 ${isActive ? 'bg-white' : 'bg-slate-600'}"></div>
                    <span class="truncate text-[13px]">${g}</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 ml-2">
                    <span class="text-[11px] font-bold tabular-nums min-w-[16px] text-center ${isActive ? 'text-blue-100' : 'text-slate-500'}">${count}</span>
                    ${g !== '全部' ? `<button onclick="event.stopPropagation(); openRenameGroupModal('${g.replace(/'/g,"\\'")}');return false;"
                        class="group-rename-btn opacity-0 p-1 rounded transition-all
                               ${isActive ? 'text-blue-200 hover:text-white hover:bg-white/20' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-700'}"
                        title="重命名分组">${editSvg}</button>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');
    if (window.lucide) lucide.createIcons();
}

function setActiveGroup(g) {
    activeGroup = g;
    renderGroups();
    renderCards();
}

// ── 卡片渲染 ──────────────────────────────────────────────────────────────
function renderCards() {
    const container = document.getElementById('cards-container');
    const emptyState = document.getElementById('empty-state');

    const filtered = activeGroup === '全部'
        ? products
        : products.filter(p => p.group === activeGroup);

    if (!filtered.length) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        if (window.lucide) lucide.createIcons();
        return;
    }

    emptyState.classList.add('hidden');
    emptyState.classList.remove('flex');
    try {
        container.innerHTML = filtered.map(p => buildCard(p)).join('');
    } catch (err) {
        container.innerHTML = `<div class="bg-red-50 border border-red-100 text-red-600 rounded-2xl p-5 text-sm font-bold">卡片渲染失败：${err.message}</div>`;
    }
    if (window.lucide) lucide.createIcons();
}

function buildCard(p) {
    const today = new Date().toISOString().slice(0, 10);
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

    const todayHistory = (p.history || []).filter(h => h.date === today);
    const yesterdayHistory = (p.history || []).filter(h => h.date === yesterday);

    const currentSales = todayHistory.length
        ? todayHistory[todayHistory.length - 1].sales : (p.history && p.history.length ? p.history[p.history.length - 1].sales : 0);

    const todayIncrease = todayHistory.length >= 2
        ? todayHistory[todayHistory.length - 1].sales - todayHistory[0].sales
        : (todayHistory.length === 1 && yesterdayHistory.length
            ? todayHistory[0].sales - yesterdayHistory[yesterdayHistory.length - 1].sales
            : null);

    const yesterdayIncrease = yesterdayHistory.length >= 2
        ? yesterdayHistory[yesterdayHistory.length - 1].sales - yesterdayHistory[0].sales
        : null;

    const todayText = todayIncrease !== null ? `+${todayIncrease}` : '-';
    const yesterdayText = yesterdayIncrease !== null ? `+${yesterdayIncrease}` : '-';

    const price = p.price ? `¥${p.price}` : '-';
    const productUrl = p.url || `https://www.xiaohongshu.com/goods-detail/${p.id}`;

    return `
    <div onclick="openDetailModal('${p.id}')" class="bg-white p-5 rounded-2xl border border-slate-200 hover:-translate-y-1 hover:border-blue-400 hover:shadow-xl transition-all group flex flex-col cursor-pointer">
        <div class="flex justify-between items-start mb-3">
            <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100">${p.group || '默认分组'}</span>
            <div class="flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-all">
                <button onclick="event.stopPropagation(); openMoveGroupModal('${p.id}')" class="text-slate-300 hover:text-blue-400 transition-colors" title="移动分组">
                    <i data-lucide="folder-symlink" size="13"></i>
                </button>
                <button onclick="event.stopPropagation(); openDeleteModal('${p.id}')" class="text-slate-300 hover:text-red-400 transition-colors" title="删除">
                    <i data-lucide="trash-2" size="13"></i>
                </button>
            </div>
        </div>

        <h3 class="font-bold text-slate-800 text-sm line-clamp-2 mb-2 leading-snug flex-1">${p.name || '商品信息获取中...'}</h3>

        <div class="flex items-center justify-between text-[10px] text-slate-400 font-bold mb-1">
            <div class="flex items-center gap-1">
                <i data-lucide="shopping-bag" size="10"></i>
                <span class="truncate max-w-[120px]">${p.shopName || '-'}</span>
            </div>
            <span class="text-blue-600 font-black text-xs">${price}</span>
        </div>

        <div class="pt-4 border-t border-slate-100 space-y-3 mt-2">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Sales</span>
                <span class="text-sm font-black text-slate-900">${currentSales ? currentSales.toLocaleString() : '-'}</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-50 px-3 py-2 rounded-xl flex flex-col">
                    <span class="text-[8px] text-slate-400 font-black uppercase">昨日增</span>
                    <span class="text-[11px] font-black text-slate-600">${yesterdayText}</span>
                </div>
                <div class="bg-blue-600 px-3 py-2 rounded-xl shadow-lg shadow-blue-100 flex flex-col">
                    <span class="text-[8px] text-blue-100 font-black uppercase">今日增</span>
                    <span class="text-[11px] font-black text-white">${todayText}</span>
                </div>
            </div>
            <!-- 操作按钮 -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <a href="${p.shopUrl || '#'}" target="_blank" onclick="event.stopPropagation()"
                    class="flex items-center justify-center gap-1 text-[10px] font-black text-slate-500 bg-slate-50 hover:bg-slate-100 py-2 rounded-xl transition-colors">
                    <i data-lucide="store" size="11"></i>
                    <span>店铺页面</span>
                </a>
                <a href="${productUrl}" target="_blank" onclick="event.stopPropagation()"
                    class="flex items-center justify-center gap-1 text-[10px] font-black text-blue-600 bg-blue-50 hover:bg-blue-100 py-2 rounded-xl transition-colors">
                    <i data-lucide="external-link" size="11"></i>
                    <span>宝贝页面</span>
                </a>
            </div>
        </div>
    </div>`;
}

function openAddProductModal() {
    parsedProduct = null;
    document.getElementById('input-url').value = '';
    document.getElementById('parsed-info').classList.add('hidden');
    document.getElementById('parse-error').classList.add('hidden');
    document.getElementById('parse-loading').classList.add('hidden');
    document.getElementById('btn-confirm').classList.add('hidden');
    document.getElementById('btn-parse').classList.remove('hidden');

    // 填充分组下拉
    const sel = document.getElementById('input-group');
    sel.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');

    document.getElementById('modal-add-product').classList.remove('hidden');
    setTimeout(() => document.getElementById('input-url').focus(), 100);
}

function parseProduct() {
    const url = document.getElementById('input-url').value.trim();
    if (!url) return;

    const m = url.match(/\/goods-detail\/([a-f0-9]+)/);
    if (!m) {
        showParseError('链接格式不正确，请粘贴小红书商品页面链接');
        return;
    }

    const itemId = m[1];
    const xsecMatch = url.match(/[?&]xsec_token=([^&]+)/);
    const xsecToken = xsecMatch ? decodeURIComponent(xsecMatch[1]) : '';

    document.getElementById('parse-loading').classList.remove('hidden');
    document.getElementById('parse-error').classList.add('hidden');
    document.getElementById('parsed-info').classList.add('hidden');
    document.getElementById('btn-parse').disabled = true;

    // 通过 fetch 调用接口（本地 HTML 直接 fetch 跨域可能被阻止，使用 no-cors 降级）
    let apiUrl = `https://mall.xiaohongshu.com/api/store/jpd/edith/detail/h5/toc?version=0.0.5&item_id=${itemId}&xsec_source=app_share`;
    if (xsecToken) apiUrl += `&xsec_token=${encodeURIComponent(xsecToken)}`;

    fetch(apiUrl, {
        headers: {
            'accept': 'application/json, text/plain, */*',
            'accept-language': 'zh-CN,zh;q=0.9',
            'detail-host': 'https://www.xiaohongshu.com',
            'origin': 'https://www.xiaohongshu.com',
            'referer': 'https://www.xiaohongshu.com/',
        }
    })
    .then(r => r.json())
    .then(data => {
        const templateData = data?.data?.template_data;
        if (!templateData || !templateData.length) throw new Error('接口返回为空');

        const obj = templateData[0];
        const priceH5 = obj.priceH5 || {};
        const sellerH5 = obj.sellerH5 || {};
        const descriptionMain = obj.descriptionMain || {};

        parsedProduct = {
            id: itemId,
            url: `https://www.xiaohongshu.com/goods-detail/${itemId}`,
            xsecToken: xsecToken,
            name: descriptionMain.name || `商品 ${itemId.slice(-6)}`,
            price: priceH5.highlightPrice || 0,
            shopName: sellerH5.name || '',
            shopUrl: sellerH5.link || '',
            shopSalesText: sellerH5.salesVolume || '',
            history: [{
                time: new Date().toLocaleString('zh-CN'),
                date: new Date().toISOString().slice(0, 10),
                sales: parseSalesNumber(priceH5.itemAnalysisDataText || ''),
                salesText: priceH5.itemAnalysisDataText || '',
            }],
        };

        document.getElementById('parsed-name').textContent = parsedProduct.name;
        document.getElementById('parsed-shop').textContent = `店铺：${parsedProduct.shopName}`;
        document.getElementById('parsed-sales').textContent = `${priceH5.itemAnalysisDataText || ''}  ¥${parsedProduct.price}`;
        document.getElementById('parsed-info').classList.remove('hidden');
        document.getElementById('parse-loading').classList.add('hidden');
        document.getElementById('btn-parse').classList.add('hidden');
        document.getElementById('btn-confirm').classList.remove('hidden');
        document.getElementById('btn-parse').disabled = false;
        if (window.lucide) lucide.createIcons();
    })
    .catch(err => {
        showParseError(`解析失败：${err.message}。请先运行 scraper.py 添加商品。`);
        document.getElementById('btn-parse').disabled = false;
    });
}

function parseSalesNumber(text) {
    if (!text) return 0;
    text = text.replace('已售', '').replace(/\s/g, '');
    if (text.includes('万')) return Math.round(parseFloat(text) * 10000);
    return parseInt(text) || 0;
}

function showParseError(msg) {
    document.getElementById('parse-error').textContent = msg;
    document.getElementById('parse-error').classList.remove('hidden');
    document.getElementById('parse-loading').classList.add('hidden');
}

        if (t) localStorage.setItem('gh_token', t.trim());

async function saveProductsToGitHub() {
    const token = getGHToken();

    const base = `https://api.github.com/repos/${GH_REPO}/contents/`;

    // 获取 products.json 的 sha
    const pRes = await fetch(base + 'products.json', { headers });
    const pInfo = await pRes.json();
