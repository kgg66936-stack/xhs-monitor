<script>
const embeddedData = window.__XHS_DATA__ || {};
let products = Array.isArray(embeddedData) ? embeddedData : (embeddedData.products || []);
let groups = [];
let activeGroup = '全部';
let parsedProduct = null;
let deleteTargetId = null;
let moveTargetId = null;
let renameTargetGroup = null;
let detailChart = null;
let currentDetailDaily = [];

const GH_REPO = 'kgg66936-stack/xhs-monitor';
const DEFAULT_GROUP = '默认分组';
const LOCAL_DATA_CACHE_KEY = 'xhs_monitor_recent_data';
const LOCAL_DATA_SYNC_MARK_KEY = 'xhs_monitor_last_synced_cache_ts';
const LOCAL_DATA_CACHE_TTL_MS = 15 * 60 * 1000;
const LOCAL_UPDATE_API = 'http://127.0.0.1:8765';
let pendingLocalCacheSync = null;
let localUpdatePollingTimer = null;

function normalizeData(data) {
    if (Array.isArray(data)) {
        return { groups: [], products: data };
    }
    return {
        groups: Array.isArray(data?.groups) ? data.groups : [],
        products: Array.isArray(data?.products) ? data.products : [],
    };
}

function buildCurrentData() {
    return {
        groups: [...groups],
        products,
    };
}

function sameData(a, b) {
    return JSON.stringify(normalizeData(a)) === JSON.stringify(normalizeData(b));
}

function readLocalDataCache() {
    try {
        const raw = localStorage.getItem(LOCAL_DATA_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed.savedAt !== 'number' || !parsed.data) return null;
        return parsed;
    } catch (err) {
        console.warn('读取本地临时数据失败：', err);
        return null;
    }
}

function writeLocalDataCache() {
    try {
        localStorage.setItem(LOCAL_DATA_CACHE_KEY, JSON.stringify({
            savedAt: Date.now(),
            data: buildCurrentData(),
        }));
    } catch (err) {
        console.warn('写入本地临时数据失败：', err);
    }
}

function clearLocalDataCache() {
    localStorage.removeItem(LOCAL_DATA_CACHE_KEY);
}

function getLastSyncedCacheTs() {
    const value = localStorage.getItem(LOCAL_DATA_SYNC_MARK_KEY);
    return value ? Number(value) || 0 : 0;
}

function markLocalCacheSynced(savedAt) {
    localStorage.setItem(LOCAL_DATA_SYNC_MARK_KEY, String(savedAt));
}

async function loadLatestData() {
    pendingLocalCacheSync = null;
    let remoteData;
    try {
        const response = await fetch(`./products.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        remoteData = normalizeData(await response.json());
    } catch (err) {
        console.warn('读取最新 products.json 失败，回退到页面内置数据：', err);
        remoteData = normalizeData(embeddedData);
    }

    const localCache = readLocalDataCache();
    if (!localCache) return remoteData;

    const cachedData = normalizeData(localCache.data);
    if (sameData(remoteData, cachedData)) {
        clearLocalDataCache();
        return remoteData;
    }

    if (Date.now() - localCache.savedAt <= LOCAL_DATA_CACHE_TTL_MS) {
        console.warn('检测到本机刚编辑过的数据，当前优先显示本机临时版本。');
        pendingLocalCacheSync = { savedAt: localCache.savedAt };
        return cachedData;
    }

    clearLocalDataCache();
    return remoteData;
}

async function syncLocalCacheToGitHubIfNeeded() {
    if (!pendingLocalCacheSync) return;

    const savedAt = pendingLocalCacheSync.savedAt;
    if (getLastSyncedCacheTs() === savedAt) return;

    try {
        await saveProductsToGitHub();
        markLocalCacheSynced(savedAt);
        console.warn('已自动把本机缓存数据补同步到 GitHub。');
    } catch (err) {
        console.warn('自动补同步到 GitHub 失败：', err);
    }
}

async function init() {
    const latestData = await loadLatestData();
    products = latestData.products;

    const savedGroups = latestData.groups;
    const groupSet = new Set([DEFAULT_GROUP, ...savedGroups]);
    products.forEach(product => {
        if (product.group) groupSet.add(product.group);
        else product.group = DEFAULT_GROUP;
    });
    groups = Array.from(groupSet);

    const now = new Date();
    document.getElementById('today-label').textContent =
        `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

    refreshSummary();
    renderGroups();
    renderCards();
    if (window.lucide) lucide.createIcons();
    syncLocalCacheToGitHubIfNeeded();
    checkLocalUpdateStatus();
}

function setLocalUpdateUi(statusText, mode = 'idle', buttonText = '本机一键更新') {
    const btn = document.getElementById('local-update-btn');
    const status = document.getElementById('local-update-status');
    if (!btn || !status) return;

    btn.textContent = buttonText;
    btn.disabled = mode === 'running';
    btn.className = mode === 'running'
        ? 'px-3 py-2 rounded-xl text-xs font-black bg-blue-600 text-white cursor-not-allowed'
        : 'px-3 py-2 rounded-xl text-xs font-black bg-slate-950 text-white hover:bg-slate-800 transition-colors';

    status.textContent = statusText;
    status.className = mode === 'error'
        ? 'mt-1 text-[10px] text-red-500 font-bold text-right'
        : mode === 'running'
            ? 'mt-1 text-[10px] text-blue-500 font-bold text-right'
            : 'mt-1 text-[10px] text-slate-400 font-bold text-right';
}

function applyLocalUpdateStatus(data) {
    if (!data?.ok) {
        setLocalUpdateUi('本机服务未就绪', 'error');
        return;
    }

    if (data.running) {
        setLocalUpdateUi('正在本机抓取，请稍等...', 'running', '更新中...');
        startLocalUpdatePolling();
        return;
    }

    setLocalUpdateUi('本机服务在线');

    stopLocalUpdatePolling();
}

async function checkLocalUpdateStatus() {
    try {
        const response = await fetch(`${LOCAL_UPDATE_API}/status?t=${Date.now()}`, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
        });
        const data = await response.json();
        applyLocalUpdateStatus(data);
    } catch (err) {
        setLocalUpdateUi('本机服务未启动', 'error');
        stopLocalUpdatePolling();
    }
}

function startLocalUpdatePolling() {
    if (localUpdatePollingTimer) return;
    localUpdatePollingTimer = setInterval(checkLocalUpdateStatus, 5000);
}

function stopLocalUpdatePolling() {
    if (!localUpdatePollingTimer) return;
    clearInterval(localUpdatePollingTimer);
    localUpdatePollingTimer = null;
}

async function triggerLocalUpdate() {
    setLocalUpdateUi('正在向本机发送更新请求...', 'running', '请求中...');
    try {
        const response = await fetch(`${LOCAL_UPDATE_API}/run`, {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data?.message || '请求失败');
        }

        setLocalUpdateUi('本机已经开始抓取，请等 2 到 5 分钟', 'running', '更新中...');
        startLocalUpdatePolling();
    } catch (err) {
        setLocalUpdateUi('本机服务没连上，请先启动本机更新服务', 'error');
        alert(`本机一键更新没有成功触发。\n\n请先双击 start_local_update_server.bat 启动本机更新服务。\n\n详细原因：${err.message}`);
    }
}

function refreshSummary() {
    let lastTime = '';
    products.forEach(product => {
        if (product.history && product.history.length) {
            const time = product.history[product.history.length - 1].time;

        }
    });

    document.getElementById('last-update').textContent =
        lastTime ? `上次更新：${lastTime}` : '';
    document.getElementById('product-count').textContent =

    const previousLabel = previous?.date ? `${formatDateMonthDay(previous.date)} 增量` : '上一日增量';
    const price = product.price ? `￥${product.price}` : '-';

    <div onclick="openDetailModal('${product.id}')" class="bg-white p-5 rounded-2xl border border-slate-200 hover:-translate-y-1 hover:border-blue-400 hover:shadow-xl transition-all group flex flex-col cursor-pointer">

                    <i data-lucide="trash-2" size="13"></i>

            </div>
        </div>

        <h3 class="font-bold text-slate-800 text-sm line-clamp-2 mb-2 leading-snug flex-1">${product.name || '商品信息获取中...'}</h3>

        <div class="flex items-center justify-between text-[10px] text-slate-400 font-bold mb-1">
            <div class="flex items-center gap-1">
                <i data-lucide="shopping-bag" size="10"></i>
                <span class="truncate max-w-[120px]">${product.shopName || '-'}</span>
            </div>
            <span class="text-blue-600 font-black text-xs">${price}</span>
        </div>

        <div class="pt-4 border-t border-slate-100 space-y-3 mt-2">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Sales</span>
                <span class="text-sm font-black text-slate-900">${currentSales ? currentSales.toLocaleString() : '-'}</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-50 px-3 py-2 rounded-xl flex flex-col">
                    <span class="text-[8px] text-slate-400 font-black">${previousLabel}</span>
                    <span class="text-[11px] font-black text-slate-600">${yesterdayText}</span>
                </div>
                <div class="bg-blue-600 px-3 py-2 rounded-xl shadow-lg shadow-blue-100 flex flex-col">
                    <span class="text-[8px] text-blue-100 font-black">${latestLabel}</span>
                    <span class="text-[11px] font-black text-white">${todayText}</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <a href="${product.shopUrl || '#'}" target="_blank" onclick="event.stopPropagation()"
                    class="flex items-center justify-center gap-1 text-[10px] font-black text-slate-500 bg-slate-50 hover:bg-slate-100 py-2 rounded-xl transition-colors">
                    <i data-lucide="store" size="11"></i>

function parseProduct() {
    const url = document.getElementById('input-url').value.trim();
    if (!url) return;

    const match = url.match(/\/goods-detail\/([a-f0-9]+)/);
    if (!match) {
        showParseError('链接格式不正确，请粘贴小红书商品详情页链接。');
        return;
    }

    const itemId = match[1];
    const xsecMatch = url.match(/[?&]xsec_token=([^&]+)/);
    const xsecToken = xsecMatch ? decodeURIComponent(xsecMatch[1]) : '';

    document.getElementById('parse-loading').classList.remove('hidden');
    document.getElementById('parse-error').classList.add('hidden');
    document.getElementById('parsed-info').classList.add('hidden');
    document.getElementById('btn-parse').disabled = true;

    let apiUrl = `https://mall.xiaohongshu.com/api/store/jpd/edith/detail/h5/toc?version=0.0.5&item_id=${itemId}&xsec_source=app_share`;
    if (xsecToken) apiUrl += `&xsec_token=${encodeURIComponent(xsecToken)}`;

    fetch(apiUrl, {
        headers: {
            accept: 'application/json, text/plain, */*',
            'accept-language': 'zh-CN,zh;q=0.9',
            'detail-host': 'https://www.xiaohongshu.com',
            origin: 'https://www.xiaohongshu.com',
            referer: 'https://www.xiaohongshu.com/',
        }
    })
    .then(response => response.json())
    .then(data => {
        const templateData = data?.data?.template_data;
        if (!templateData || !templateData.length) {
            throw new Error('接口返回为空');
        }

        const item = templateData[0];
        const priceH5 = item.priceH5 || {};
        const sellerH5 = item.sellerH5 || {};
        const descriptionMain = item.descriptionMain || {};

        parsedProduct = {
            id: itemId,
            url: `https://www.xiaohongshu.com/goods-detail/${itemId}`,
            xsecToken,
            name: descriptionMain.name || `商品 ${itemId.slice(-6)}`,
            price: priceH5.highlightPrice || 0,
            shopName: sellerH5.name || '',
            shopUrl: sellerH5.link || '',
            shopSalesText: sellerH5.salesVolume || '',
            history: [{
                time: new Date().toLocaleString('zh-CN'),
                date: new Date().toISOString().slice(0, 10),
                sales: parseSalesNumber(priceH5.itemAnalysisDataText || ''),
                salesText: priceH5.itemAnalysisDataText || '',
            }],
        };

        document.getElementById('parsed-name').textContent = parsedProduct.name;
        document.getElementById('parsed-shop').textContent = `店铺：${parsedProduct.shopName || '-'}`;
        document.getElementById('parsed-sales').textContent = `${priceH5.itemAnalysisDataText || '销量未知'}  ￥${parsedProduct.price}`;
        document.getElementById('parsed-info').classList.remove('hidden');
        document.getElementById('parse-loading').classList.add('hidden');
        document.getElementById('btn-parse').classList.add('hidden');
        document.getElementById('btn-confirm').classList.remove('hidden');
        document.getElementById('btn-parse').disabled = false;
        if (window.lucide) lucide.createIcons();
    })
    .catch(err => {
        showParseError(`解析失败：${err.message}。如果网页里无法直接解析，可以继续用本地抓取脚本。`);
        document.getElementById('btn-parse').disabled = false;
    });
}

function parseSalesNumber(text) {
    if (!text) return 0;
    const cleaned = String(text).replace('已售', '').replace(/\s/g, '');
    if (cleaned.includes('万')) return Math.round(parseFloat(cleaned) * 10000);
    return parseInt(cleaned, 10) || 0;
}

function showParseError(message) {
    document.getElementById('parse-error').textContent = message;
    document.getElementById('parse-error').classList.remove('hidden');
    document.getElementById('parse-loading').classList.add('hidden');
}

function getGHToken() {
    let token = localStorage.getItem('gh_token');
    if (!token) {
        token = prompt('请输入 GitHub Personal Access Token。这个 Token 只需要输入一次，会保存在当前浏览器里。');
        if (token) localStorage.setItem('gh_token', token.trim());
    }
    return token ? token.trim() : null;
}

async function saveProductsToGitHub() {
    const token = getGHToken();
    if (!token) throw new Error('没有提供 GitHub Token');

    const headers = {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json',
    };
    const base = `https://api.github.com/repos/${GH_REPO}/contents/`;
    const response = await fetch(base + 'products.json', { headers });
    const fileInfo = await response.json();

    if (!fileInfo.sha) {
        throw new Error('获取 products.json 版本信息失败：' + JSON.stringify(fileInfo));
    }

    const saveData = { groups, products };
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(saveData, null, 2))));
    const updateResponse = await fetch(base + 'products.json', {
        method: 'PUT',
        headers,
        body: JSON.stringify({
            message: 'update products.json',
            content,
            sha: fileInfo.sha,
        }),
    });

    if (!updateResponse.ok) {
        throw new Error('写入 products.json 失败：' + await updateResponse.text());
    }
}

function saveWithFeedback(successMessage, failedPrefix) {
    return saveProductsToGitHub()
        .then(() => {
            writeLocalDataCache();
            alert(successMessage);
            return true;
        })
        .catch(err => {
            alert(`${failedPrefix}：${err.message}`);
            return false;
        });
}

function openDetailModal(id) {
    const product = products.find(item => item.id === id);
    if (!product) return;

    const daily = buildDailyStats(product);
    currentDetailDaily = daily;

    const current = daily.length ? daily[daily.length - 1] : { sales: 0, increase: null };
    const yesterday = daily.length >= 2 ? daily[daily.length - 2] : null;
    const growth7d = calcSevenDayGrowth(daily);

    document.getElementById('detail-group').textContent = product.group || DEFAULT_GROUP;
    document.getElementById('detail-name').textContent = product.name || '商品信息获取中...';
    document.querySelector('#detail-shop span').textContent = product.shopName || '-';
    document.getElementById('detail-total').textContent = current.sales ? current.sales.toLocaleString() : '-';
    document.getElementById('detail-growth').textContent = growth7d;
    document.getElementById('detail-latest-label').textContent = current.date ? `${formatDateMonthDay(current.date)} 增量` : '最新日增量';
    document.getElementById('detail-previous-label').textContent = yesterday?.date ? `${formatDateMonthDay(yesterday.date)} 增量` : '上一日增量';
    document.getElementById('detail-today').textContent = current.increase !== null ? `+${current.increase}` : '+0';
    document.getElementById('detail-yesterday').textContent = yesterday && yesterday.increase !== null ? `+${yesterday.increase}` : '-';

    document.querySelectorAll('.detail-range-btn').forEach((button, index) => {
        button.className = index === 0
            ? 'detail-range-btn bg-slate-950 text-white px-4 py-2 rounded-lg text-xs font-black'
            : 'detail-range-btn text-slate-700 px-4 py-2 rounded-lg text-xs font-black';
    });

    applyDetailRange('30d');
    document.getElementById('modal-detail').classList.remove('hidden');
    if (window.lucide) lucide.createIcons();
}

function applyDetailRange(range) {
    const daily = currentDetailDaily;
    let filtered = [];

    if (range === '30d') {
        filtered = daily.slice(-30);
    } else if (range === 'monthly') {
        const byMonth = {};
        daily.forEach(item => {
            const month = item.date.slice(0, 7);
            if (!byMonth[month]) byMonth[month] = { date: month, sales: 0, increase: 0 };
            byMonth[month].sales = item.sales;
            if (item.increase !== null) byMonth[month].increase += item.increase;
        });
        filtered = Object.values(byMonth).sort((a, b) => a.date.localeCompare(b.date));
    } else {
        filtered = daily;
    }

    const table = document.getElementById('detail-table');
    table.innerHTML = filtered.slice().reverse().map(item => `
        <div class="grid grid-cols-2 items-center py-3 text-sm border-b border-slate-50 last:border-0">
            <span class="text-slate-400 font-black">${range === 'monthly' ? item.date : formatDateShort(item.date)}</span>
            <span class="text-right text-blue-600 font-black">${item.increase !== null && item.increase !== 0 ? '+' + item.increase : (item.increase === 0 ? '0' : '+0')}</span>
        </div>
    `).join('');

    setTimeout(() => renderDetailChart(filtered, range), 50);
}

function switchDetailRange(button, range) {
    document.querySelectorAll('.detail-range-btn').forEach(item => {
        item.className = 'detail-range-btn text-slate-700 px-4 py-2 rounded-lg text-xs font-black';
    });
    button.className = 'detail-range-btn bg-slate-950 text-white px-4 py-2 rounded-lg text-xs font-black';
    applyDetailRange(range);
}

function buildDailyStats(product) {
    const byDate = {};
    (product.history || []).forEach(item => {
        if (!item.date) return;
        if (!byDate[item.date]) byDate[item.date] = [];
        byDate[item.date].push(item);
    });

    const dates = Object.keys(byDate).sort();
    let previousSales = null;

    return dates.map(date => {
        const records = byDate[date]
            .slice()
            .sort((a, b) => new Date(String(a.time).replace(/\//g, '-')) - new Date(String(b.time).replace(/\//g, '-')));
        const first = records[0];
        const last = records[records.length - 1];
        let increase = null;

        if (records.length >= 2) {
            increase = last.sales - first.sales;
        } else if (previousSales !== null) {
            increase = last.sales - previousSales;
        }

        previousSales = last.sales;
        return { date, sales: last.sales, increase };
    });
}

function renderDetailChart(daily, range) {
    const element = document.getElementById('detail-chart');
    if (!element || !window.echarts) return;

    if (detailChart) detailChart.dispose();
    detailChart = echarts.init(element);

    const labels = daily.map(item => range === 'monthly' ? item.date : formatDateShort(item.date));
    const values = daily.map(item => item.increase === null ? 0 : item.increase);

    detailChart.setOption({
        grid: { left: 56, right: 18, top: 20, bottom: 36 },
        tooltip: {
            trigger: 'axis',
            backgroundColor: '#ffffff',
            borderColor: '#e5e7eb',
            borderWidth: 1,
            textStyle: { color: '#0f172a', fontWeight: 700 },
            formatter: params => {
                const point = params[0];
                return `${point.axisValue}<br/>新增销量：<b>${point.data}</b>`;
            }
        },
        xAxis: {
            type: 'category',
            data: labels,
            boundaryGap: false,
            axisLine: { lineStyle: { color: '#94a3b8' } },
            axisTick: { show: false },
            axisLabel: { color: '#64748b', fontSize: 11, margin: 10 },
        },
        yAxis: {
            type: 'value',
            axisLine: { show: false },
            axisTick: { show: false },
            splitLine: { lineStyle: { color: '#e9eef5', type: 'dashed' } },
            axisLabel: { color: '#64748b', fontSize: 11, margin: 12 },
        },
        series: [{
            data: values,
            type: 'line',
            smooth: true,
            symbol: 'circle',
            symbolSize: 8,
            lineStyle: { width: 4, color: '#2f7df6' },
            itemStyle: { color: '#ffffff', borderColor: '#2f7df6', borderWidth: 3 },
            areaStyle: {
                color: {
                    type: 'linear',
                    x: 0, y: 0, x2: 0, y2: 1,
                    colorStops: [
                        { offset: 0, color: 'rgba(47, 125, 246, 0.18)' },
                        { offset: 1, color: 'rgba(47, 125, 246, 0.05)' }
                    ]
                }
            },
        }]
    });
}

function calcSevenDayGrowth(daily) {
    if (daily.length < 2) return '-';

    const last = daily[daily.length - 1].sales || 0;
    const start = daily[Math.max(0, daily.length - 8)].sales || 0;
    if (!start) return '-';

    const rate = ((last - start) / start) * 100;
    return `${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%`;
}

function formatDateShort(date) {
    const [, month, day] = date.split('-');
    return `${Number(month)}-${Number(day)}`;
}

function formatDateMonthDay(date) {
    const [, month, day] = date.split('-');
    return `${month}-${day}`;
}

function openDeleteModal(id) {
    deleteTargetId = id;
    document.getElementById('modal-delete').classList.remove('hidden');
}

function confirmDelete() {
    if (!deleteTargetId) return;

    products = products.filter(product => product.id !== deleteTargetId);
    deleteTargetId = null;
    closeModal('modal-delete');
    refreshSummary();
    renderGroups();
    renderCards();

    saveWithFeedback('商品已删除，并已同步到 GitHub。', '商品已从页面移除，但同步失败');
}

function openMoveGroupModal(id) {
    moveTargetId = id;
    const product = products.find(item => item.id === id);
    const currentGroup = product ? (product.group || DEFAULT_GROUP) : '';
    const list = document.getElementById('move-group-list');

    list.innerHTML = groups.map(groupName => {
        const safeGroupName = groupName.replace(/'/g, "\\'");
        const isCurrent = groupName === currentGroup;
        return `<button onclick="confirmMoveGroup('${safeGroupName}');return false;"
            class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-bold transition-colors
                   ${isCurrent ? 'bg-blue-50 border border-blue-200 text-blue-600 cursor-default' : 'hover:bg-slate-50 border border-slate-100 text-slate-700'}">
            <span>${groupName}</span>
            ${isCurrent ? '<span class="text-[10px] text-blue-400 font-black">当前分组</span>' : ''}
        </button>`;
    }).join('');

    document.getElementById('modal-move-group').classList.remove('hidden');
    if (window.lucide) lucide.createIcons();
}

function confirmMoveGroup(newGroup) {
    if (!moveTargetId) return;

    const product = products.find(item => item.id === moveTargetId);
    if (product) {
        product.group = newGroup;
        if (!groups.includes(newGroup)) groups.push(newGroup);
    }

    moveTargetId = null;
    closeModal('modal-move-group');
    renderGroups();
    renderCards();
    saveWithFeedback('分组移动成功，并已同步到 GitHub。', '分组移动成功，但同步失败');
}

function openRenameGroupModal(groupName) {
    renameTargetGroup = groupName;
    const input = document.getElementById('input-rename-group');
    input.value = groupName;
    document.getElementById('modal-rename-group').classList.remove('hidden');
    setTimeout(() => input.focus(), 100);
}

function confirmRenameGroup() {
    const newName = document.getElementById('input-rename-group').value.trim();
    if (!newName) return;
    if (newName === renameTargetGroup) {
        closeModal('modal-rename-group');
        return;
    }
    if (groups.includes(newName)) {
        alert('该分组名称已经存在。');
        return;
    }

    const index = groups.indexOf(renameTargetGroup);
    if (index !== -1) groups[index] = newName;

    products.forEach(product => {
        if (product.group === renameTargetGroup) product.group = newName;
    });

    if (activeGroup === renameTargetGroup) activeGroup = newName;

    renameTargetGroup = null;
    closeModal('modal-rename-group');
    renderGroups();
    renderCards();
    saveWithFeedback('分组重命名成功，并已同步到 GitHub。', '分组重命名成功，但同步失败');
}

function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
}

document.querySelectorAll('[id^="modal-"]').forEach(modal => {
    modal.addEventListener('click', event => {
        if (event.target === modal) closeModal(modal.id);
    });
});

init();
</script>
